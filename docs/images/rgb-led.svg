<svg xmlns="http://www.w3.org/2000/svg" width="440" height="330" viewBox="0 0 440 330" font-family="Menlo, Consolas, monospace" font-size="13">
  <rect width="440" height="330" fill="#ffffff"/>

  <!-- KY-016 module board -->
  <rect x="120" y="40" width="200" height="110" rx="6" fill="#222" stroke="#555" stroke-width="1.5"/>
  <circle cx="220" cy="80" r="22" fill="#dcdcdc" stroke="#9a9a9a" stroke-width="1.5"/>
  <text x="332" y="62" fill="#333">KY-016</text>
  <text x="332" y="78" fill="#333">common</text>
  <text x="332" y="94" fill="#333">cathode</text>

  <!-- Header pins and labels (the order varies by maker: wire by label) -->
  <g fill="#e2c25a" stroke="#8a6d1a" stroke-width="1">
    <rect x="144" y="132" width="12" height="12"/>
    <rect x="184" y="132" width="12" height="12"/>
    <rect x="224" y="132" width="12" height="12"/>
    <rect x="264" y="132" width="12" height="12"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-weight="bold">
    <text x="150" y="124">R</text>
    <text x="190" y="124">G</text>
    <text x="230" y="124">B</text>
    <text x="270" y="124">−</text>
  </g>

  <!-- Wires -->
  <g stroke-width="2.5" fill="none" stroke-linejoin="round">
    <polyline stroke="#e0201b" points="150,144 150,190 70,190 70,278"/>
    <polyline stroke="#1fb81f" points="190,144 190,210 170,210 170,278"/>
    <polyline stroke="#1f4fe0" points="230,144 230,225 270,225 270,278"/>
    <polyline stroke="#333" points="270,144 270,160 370,160 370,278"/>
  </g>

  <!-- Pi header terminals -->
  <rect x="30" y="266" width="385" height="24" rx="4" fill="#1d5c2e"/>
  <g fill="#e2c25a" stroke="#8a6d1a" stroke-width="1">
    <circle cx="70" cy="278" r="6"/>
    <circle cx="170" cy="278" r="6"/>
    <circle cx="270" cy="278" r="6"/>
    <circle cx="370" cy="278" r="6"/>
  </g>
  <g fill="#333" text-anchor="middle">
    <text x="70" y="307">GPIO22</text>
    <text x="70" y="322" font-size="11">pin 15</text>
    <text x="170" y="307">GPIO23</text>
    <text x="170" y="322" font-size="11">pin 16</text>
    <text x="270" y="307">GPIO24</text>
    <text x="270" y="322" font-size="11">pin 18</text>
    <text x="370" y="307">GND</text>
    <text x="370" y="322" font-size="11">pin 14</text>
  </g>
  <text x="20" y="24" fill="#333">A GPIO driven high lights its colour</text>
</svg>
