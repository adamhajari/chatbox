<svg xmlns="http://www.w3.org/2000/svg" width="440" height="370" viewBox="0 0 440 370" font-family="Menlo, Consolas, monospace" font-size="13">
  <rect width="440" height="370" fill="#ffffff"/>

  <!-- LED body -->
  <path d="M180,100 V62 A30,30 0 0 1 240,62 V100 Z" fill="#dcdcdc" stroke="#9a9a9a" stroke-width="1.5"/>
  <rect x="172" y="100" width="76" height="12" fill="#c8c8c8" stroke="#9a9a9a" stroke-width="1.5"/>
  <rect x="182" y="113" width="8" height="5" fill="#e0201b"/>
  <rect x="214" y="113" width="8" height="5" fill="#1fb81f"/>
  <rect x="230" y="113" width="8" height="5" fill="#1f4fe0"/>
  <text x="252" y="60" fill="#333">5 mm RGB LED</text>
  <text x="252" y="76" fill="#333">common anode</text>

  <!-- Legs -->
  <g stroke="#6a6a6a" stroke-width="4" stroke-linecap="square" fill="none">
    <line x1="186" y1="118" x2="186" y2="190"/>
    <line x1="202" y1="112" x2="202" y2="215"/>
    <line x1="218" y1="118" x2="218" y2="190"/>
    <line x1="234" y1="118" x2="234" y2="165"/>
  </g>
  <text x="196" y="136" fill="#c00" font-weight="bold" font-size="12">+</text>

  <!-- Wires -->
  <g stroke-width="2.5" fill="none" stroke-linejoin="round">
    <polyline stroke="#e0201b" points="202,215 170,215 170,318"/>
    <polyline stroke="#333" points="186,190 70,190 70,318"/>
    <polyline stroke="#333" points="218,190 270,190 270,318"/>
    <polyline stroke="#333" points="234,165 370,165 370,318"/>
  </g>
  <text x="178" y="262" fill="#c00" font-size="11">no</text>
  <text x="178" y="275" fill="#c00" font-size="11">resistor</text>

  <!-- 220 ohm resistors: red, red, brown, gold -->
  <defs>
  <g id="res">
    <rect x="-9" y="0" width="18" height="52" rx="7" fill="#e8d3a2" stroke="#b09a6a" stroke-width="1"/>
    <rect x="-9" y="9" width="18" height="5" fill="#d0201b"/>
    <rect x="-9" y="18" width="18" height="5" fill="#d0201b"/>
    <rect x="-9" y="27" width="18" height="5" fill="#7a4a1a"/>
    <rect x="-9" y="40" width="18" height="4" fill="#c9a227"/>
  </g>
  </defs>
  <use href="#res" x="70" y="226"/>
  <use href="#res" x="270" y="226"/>
  <use href="#res" x="370" y="226"/>
  <text x="84" y="257" fill="#333">220Ω</text>
  <text x="284" y="257" fill="#333">220Ω</text>
  <text x="384" y="257" fill="#333">220Ω</text>

  <!-- Pi header terminals -->
  <rect x="30" y="306" width="385" height="24" rx="4" fill="#1d5c2e"/>
  <g fill="#e2c25a" stroke="#8a6d1a" stroke-width="1">
    <circle cx="70" cy="318" r="6"/>
    <circle cx="170" cy="318" r="6"/>
    <circle cx="270" cy="318" r="6"/>
    <circle cx="370" cy="318" r="6"/>
  </g>
  <g fill="#333" text-anchor="middle">
    <text x="70" y="347">GPIO22</text>
    <text x="70" y="362" font-size="11">pin 15</text>
    <text x="170" y="347" fill="#c00">3V3</text>
    <text x="170" y="362" font-size="11">pin 1</text>
    <text x="270" y="347">GPIO23</text>
    <text x="270" y="362" font-size="11">pin 16</text>
    <text x="370" y="347">GPIO24</text>
    <text x="370" y="362" font-size="11">pin 18</text>
  </g>
  <text x="20" y="24" fill="#333">A GPIO pulled low lights its colour</text>
</svg>
