# Runtime settings (not the parent policy). Paths are relative to this file.

[paths]
# This machine's policy: the one Chatbox uses and the settings page edits. It isn't
# tracked by git, so a device's settings never collide with `git pull`. If it doesn't
# exist, Chatbox creates it as a copy of policy_default, the tracked starting point.
policy = "policies/local.yaml"
policy_default = "policies/default.yaml"
database = "data/chatbox.db"

# Parent web UI (chatbox talk --web / chatbox chat --web). No password yet (PLAN.md D7a):
# anyone on the home network can open it and edit the policy.
[web]
# "auto" binds to this computer's home-network address only (not every interface).
# Or give an address, e.g. "192.168.1.20", or "127.0.0.1" for this computer only.
host = "auto"
port = 8321

[logging]
# On: every question and answer is saved in data/chatbox.db, for the settings page's
# "Today's questions and answers" and `chatbox log`. Off: only a per-day question count
# is stored (for the daily limit); no question or answer text is saved.
enabled = true

# Token prices, for the cost estimate logged with each question (every model call it
# made: the classifier, the answer, and the output check). US dollars per million tokens;
# cached_input is the rate for prompt tokens the vendor served from its cache. A model not
# listed here is logged with its tokens but no cost. Prices change: check the vendor's
# pricing page when changing models. These are from September 2026.
[pricing]
"claude-haiku-4-5" = { input = 1.00, output = 5.00 }
"claude-sonnet-5" = { input = 2.00, output = 10.00 }
"claude-opus-5" = { input = 5.00, output = 25.00 }
"gpt-6-luna" = { input = 0.10, output = 0.50, cached_input = 0.01 }

[provider]
# "anthropic" or "openai". This one line switches the answering model and both
# guardrail checks below; each vendor's settings stay filled in.
name = "openai"

[provider.anthropic]
# model = "claude-opus-5"
model = "claude-haiku-4-5"
# Lower effort = faster, shorter answers. One of: low, medium, high, xhigh, max.
# Remove this line for claude-haiku-4-5, which doesn't accept it.
# effort = "low"   # Opus/Sonnet only; Haiku rejects it
max_tokens = 4000
# Seconds before an answer request gives up (the kid then hears the error reply).
timeout_seconds = 15

[provider.openai]
# Needs OPENAI_API_KEY in .env.
model = "gpt-6-luna"
# "none" turns reasoning off: faster and cheaper. Unset, the model reasons at "medium".
reasoning_effort = "none"
max_tokens = 4000
timeout_seconds = 15

# Guardrail layers 3 and 4 (see README). Each is a separate, fast model call with
# structured output, on the same vendor as the answering model ([provider] name), with
# that vendor's model settings in the .anthropic / .openai subsection. If a check errors,
# times out, or returns something unusable, the kid gets a canned reply (fail closed).
[guardrails]
# How many recent question/answer pairs the checks see, so "why?" is judged in context.
history_exchanges = 6
# Answers up to this fraction over the policy's max_words / max_sentences still pass
# (0.25 = 25%); longer ones are replaced with the blocked-topic reply.
length_tolerance = 0.25

[guardrails.classifier]
# Hard deadline for the check, including retries. Typically ~1.2 s, but its tail reaches
# 4 s even on a good network, and on a Pi 3B a 4 s deadline failed most questions
# (docs/development.md). Past it the child hears the "something went wrong" reply.
timeout_seconds = 9
max_retries = 1

[guardrails.classifier.anthropic]
model = "claude-haiku-4-5"
max_tokens = 300

[guardrails.classifier.openai]
model = "gpt-6-luna"
reasoning_effort = "none"
max_tokens = 300

[guardrails.output_check]
# false skips layer 4 entirely (including the length check): answers come back ~1 s
# sooner but are no longer checked before the kid hears them.
enabled = false
timeout_seconds = 4
max_retries = 1

[guardrails.output_check.anthropic]
model = "claude-haiku-4-5"
max_tokens = 300

[guardrails.output_check.openai]
model = "gpt-6-luna"
reasoning_effort = "none"
max_tokens = 300

# Voice (chatbox talk). Pipeline B: speech-to-text -> the text pipeline above ->
# text-to-speech. Credentials come from .env (GOOGLE_APPLICATION_CREDENTIALS,
# GOOGLE_CLOUD_PROJECT). No audio is stored.
[speech]
language = "en-US"

[speech.stt]
name = "google"

[speech.stt.google]
# Model and region go together; see README "Speech settings" for measured trade-offs.
model = "long"
location = "global"

[speech.tts]
# "openai" or "google". Both sections below stay filled in, so switching is this one line.
name = "google"

[speech.tts.openai]
# gpt-4o-mini-tts voices: alloy, ash, ballad, coral, echo, fable, nova, onyx, sage,
# shimmer, verse, marin, cedar. Needs OPENAI_API_KEY in .env.
voice = "marin"
model = "gpt-4o-mini-tts"
# How to speak, in plain words (the model follows it loosely).
instructions = "Speak warmly and gently at a relaxed pace, like a friendly helper talking to a curious young child. Sound interested, not sing-song."
timeout_seconds = 10

[speech.tts.google]
# Any Google voice. Chirp 3 HD voices stream (audio starts sooner); others, such as
# Neural2, are made whole and then played. Swap the comment to switch:
# voice = "en-US-Chirp3-HD-Leda"
voice = "en-US-Neural2-J"
sample_rate = 24000
timeout_seconds = 10

[voice]
# Presses shorter than this are treated as accidental taps (a soft blip, nothing sent).
min_press_seconds = 0.3
# Recordings quieter than this (RMS of 16-bit samples) get the "didn't catch that" reply
# without calling speech-to-text. Raise it in a noisy room.
silence_rms = 200
# Seconds to wait for the transcript after the spacebar is released.
stt_timeout_seconds = 5
max_seconds = 30
sample_rate = 16000
# Spacebar release detection (the terminal only sees key repeats; see README).
key_repeat_wait_seconds = 0.6
release_gap_seconds = 0.2
# The Pi's button and status LED (docs/hardware.md). These are per-machine, so set them
# in chatbox.local.toml rather than here: button_gpio = 17, led_gpio = [22, 23, 24],
# led_common_anode = true. Unset means spacebar only and no light.
# Audio devices by name or number (python -m sounddevice lists them); omit for defaults.
# input_device = "MacBook Pro Microphone"
# output_device = "MacBook Pro Speakers"

# The picture screen: a 2.2" SPI display (ILI9341, 240x320) showing a picture of what
# was asked about while Chatbox speaks (PLAN.md D28/D29, docs/hardware.md). Pictures
# only, never text. The subject and its category come from the guardrail classifier,
# and the picture is the lead image of the Wikipedia article for both ("python animal").
# Which categories get a picture is set in the policy (`pictures.categories`), from the
# settings page.
#
# Only the Pi has a screen, so turn it on in chatbox.local.toml, not here. The values
# below are the defaults and are documented rather than set:
#
#     [screen]
#     enabled = true
#
[screen]
# false (or no [screen] section at all) means no screen: nothing is imported, no pin is
# opened and no picture is ever fetched.
enabled = false
# D/C and RESET. SPI0 supplies CS/SCK/MOSI on GPIO8/11/10; cs = 1 uses CE1 (GPIO7).
dc_gpio = 25
reset_gpio = 27
cs = 0
# SPI clock. Drop to 16000000 if the picture comes up with noise or torn lines.
baudrate = 24000000
# Which way up the panel is mounted. 90 and 270 are landscape (320x240), which is what
# Chatbox uses: a photograph of a thing is usually wider than it is tall, so a portrait
# panel letterboxes most pictures heavily. 0 and 180 are portrait (240x320).
# Pictures are sized to match, so changing this changes their shape too.
rotation = 90
# The backlight on a GPIO, so that a blank screen is genuinely dark rather than a lit
# grey rectangle. Unset means the display's LED pin is wired to 3V3 and always on.
# backlight_active_high = false for a P-MOSFET high-side switch (GPIO low = lit).
# backlight_gpio = 12
backlight_active_high = true
# Hard ceiling on looking a picture up. Speech NEVER waits for this (PLAN.md D4): a
# picture that isn't ready when the answer starts appears late or not at all.
timeout_seconds = 3
# An animal battle ("who would win, a shark or a crocodile?") gets a picture of each
# animal, and the screen swaps between them this often while the answer is spoken.
swap_seconds = 3
# Where fetched pictures are cached, relative to this file. Unset = "pictures" beside
# the database. Cached subjects are never fetched again.
# cache_dir = "data/pictures"
