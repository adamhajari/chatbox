[project]
name = "talkbox"
version = "0.1.0"
description = "A kid-friendly voice assistant with parent-set guardrails"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Voice (Phase 3). Apache-2.0 / MIT.
    "google-cloud-speech>=2.33",
    "google-cloud-texttospeech>=2.29",
    "sounddevice>=0.5",
    # Parent web UI (Phase 4). MIT / BSD-3-Clause.
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]  # httpx: FastAPI's test client

[project.scripts]
talkbox = "talkbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talkbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real model API (skipped without ANTHROPIC_API_KEY)"]
